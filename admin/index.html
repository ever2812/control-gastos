<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balanz | Control financiero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/estilo.css">
</head>
<body>


    <input type="hidden" value="0" id="idUser" name="idUser">
<div class="header-app shadow-sm">
    <div class="container text-center">
        <p class="mb-1 opacity-75">Saldo Disponible</p>
        <h1 id="saldoTotal" class="fw-bold mb-0">$12,450.00</h1>
    </div>
</div>

<div class="container">
    <div class="row g-3 mb-4">
        <div class="col-6">
            <div class="card card-custom p-3 text-center">
                <i class="bi bi-arrow-down-left-circle text-success fs-3"></i>
                <small class="text-muted d-block mt-2">Mes Actual</small>
                <span id="resumenIngresos" class="fw-bold text-success">+$0.00</span>
            </div>
        </div>
        <div class="col-6">
            <div class="card card-custom p-3 text-center">
                <i class="bi bi-arrow-up-right-circle text-danger fs-3"></i>
                <small class="text-muted d-block mt-2">Mes Actual</small>
                <span id="resumenEgresos" class="fw-bold text-danger">-$0.00</span>
            </div>
        </div>
    </div>

    <h6 class="fw-bold mb-3 px-1">Movimientos Recientes</h6>
    <div class="row mb-4 justify-content-center">
    <div class="col-md-4 col-10">
        <div class="input-group shadow-sm">
            <span class="input-group-text bg-white border-0"><i class="bi bi-calendar3"></i></span>
            <input type="month" id="filtroMes" class="form-control border-0 py-2" value="2026-04">
        </div>
    </div>
</div>
    
    <div class="mobile-list">
        <div class="transaction-item shadow-sm">
            <div>
                <strong class="d-block">Venta Producto A</strong>
                <small class="text-muted">Hoy, 2:30 PM • Ventas</small>
            </div>
            <span class="fw-bold text-success">+$1,200.00</span>
        </div>
        <div class="transaction-item shadow-sm">
            <div>
                <strong class="d-block">Pago Internet</strong>
                <small class="text-muted">Ayer • Servicios</small>
            </div>
            <span class="fw-bold text-danger">-$550.00</span>
        </div>
    </div>

    <div class="table-desktop card card-custom p-3">
        <table class="table align-middle mb-0 table-desktop" >
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Concepto/Descripción</th>
                    <th>Tipo Movimiento</th>
                    <th class="text-end">Monto</th>
                </tr>
            </thead>
            <tbody id="tablaMovimientos" class="tablaMovimientos">
                 <!-- Aquí se insertarán los movimientos desde JavaScript -->

            </tbody>
        </table>
    </div>
</div>

<div class="bottom-nav">
    <a href="#" class="nav-item-btn active">
        <i class="bi bi-house-door-fill"></i>
        <span>Inicio</span>
    </a>

    <a href="#" class="nav-item-btn" data-bs-toggle="modal" data-bs-target="#modalRegistro">
        <div class="fab-add">
            <i class="bi bi-plus-lg"></i>
        </div>
        <span style="color:transparent">Add</span>
    </a>
 
    <a href="#" class="nav-item-btn" id="btnSalir" >
        <i class="bi bi-box-arrow-right" ></i>
        <span>Salir</span>
    </a>
</div>

<div class="modal fade" id="modalRegistro" tabindex="-1" aria-labelledby="modalRegistroLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
            <div class="modal-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">Nuevo Movimiento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="FormRegistro">
                    <div class="btn-group w-100 mb-4" role="group">
                        <input type="radio" class="btn-check" name="tipo_mov" id="btnIngreso" checked>
                        <label class="btn btn-outline-success border-2 fw-bold" for="btnIngreso">
                            <i class="bi bi-plus-circle me-1"></i> Entrada
                        </label>
                        
                        <input type="radio" class="btn-check" name="tipo_mov" id="btnEgreso">
                        <label class="btn btn-outline-danger border-2 fw-bold" for="btnEgreso">
                            <i class="bi bi-dash-circle me-1"></i> Salida
                        </label>
                    </div>
                    
                    <div class="mb-3">
                        <label class="small text-muted fw-bold">MONTO</label> 
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 fs-4">$</span>
                            <input type="number" name="monto" class="form-control form-control-lg bg-light border-0 fs-4 fw-bold" placeholder="0.00" step="0.01" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="small text-muted fw-bold">Concepto</label>                        
                        <select name="" id="idConcepto" class="form-select bg-light border-0 py-2" required>
                            <option value="" selected disabled>Cargando conceptos...</option>
                        </select>
                
                    </div>
                    <div class="mb-3">
                                <label class="small text-muted fw-bold">Descripción</label>                        
                        <input type="text" name="descripcion" id="descripcionMov" class="form-control bg-light border-0 py-2" placeholder="Ej. Pago a proveedores, Venta servicio..." required>
                    </div>
                    
                    <button class="btn btn-dark w-100 py-3 fw-bold shadow-sm" style="border-radius: 15px;">
                        Guardar Registro
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <script>
        // Verificar si el usuario está autenticado
        const idUser = localStorage.getItem('idUser');
        console.log('ID Usuario:', idUser); // Agrega este log para verificar el valor de idUser

        if (!idUser) {
            window.location.href = '../'; // Redirigir al login si no está autenticado
        }
        else{
            document.getElementById('idUser').value = idUser; // Guardar el ID del usuario en un campo oculto para usarlo en otras partes del código
        }
    </script>

<script src="../js/getConceptoEntradas.js"></script>
<script src="../js/setMesActual.js"></script>
<script src="../js/getMovimientos.js"></script>
<script src="../js/saveMovimientos.js"></script>
<script src="../js/loadDashboard.js"></script>
<script src="../js/getFiltroMes.js"></script>
<script src="../admin/validateSesion.js"></script>
<script src="../admin/logOut.js"></script>



<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        <i class="bi bi-check-circle me-2"></i> Registro guardado correctamente.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="modal"></button>
    </div>
  </div>
</div>
</body>
</html>
