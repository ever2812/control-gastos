<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashFlow | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/estilo-login.css">
</head>
<body>

<div class="login-container">
    <div class="card auth-card">
        <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        
        <div id="loginView">
            <h4 class="text-center fw-bold mb-4" style="color: var(--navy-deep);">Bienvenido</h4>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="emailUsuario" class="form-control" placeholder="nombre@ejemplo.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="psdUsuario" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-navy">Iniciar Sesión</button>
            </form>
            <div class="auth-switch">
                <span class="text-muted">¿No tienes cuenta?</span> 
                <a href="javascript:void(0)" onclick="toggleAuth()">Regístrate</a>
            </div>
        </div>

        <div id="registerView" class="d-none">
            <h4 class="text-center fw-bold mb-4" style="color: var(--navy-deep);">Crea tu cuenta</h4>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Nombre del Negocio</label>
                    <input type="text" class="form-control" placeholder="Mi Empresa" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" placeholder="correo@empresa.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" placeholder="Crea una contraseña" required>
                </div>
                <button type="submit" class="btn btn-navy">Registrarme</button>
            </form>
            <div class="auth-switch">
                <span class="text-muted">¿Ya tienes cuenta?</span> 
                <a href="javascript:void(0)" onclick="toggleAuth()">Inicia Sesión</a>
            </div>
        </div>
    </div>
</div>

<script>
    // Función para cambiar entre Login y Registro sin recargar
    function toggleAuth() {
        const loginView = document.getElementById('loginView');
        const registerView = document.getElementById('registerView');
        
        loginView.classList.toggle('d-none');
        registerView.classList.toggle('d-none');
    }
</script>

<script src="js/login.js"></script>

</body>
</html>
